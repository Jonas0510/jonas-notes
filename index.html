<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonas Academy - Coming Soon</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .maintenance-container {
            max-width: 500px;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .title {
            color: #fff;
            font-size: 2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .message-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
        }

        .status {
            color: #ffcc66;
            font-size: 1.1rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .message {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            line-height: 1.8;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }

            .message-box {
                padding: 30px 20px;
            }

            .status {
                font-size: 1rem;
            }

            .message {
                font-size: 0.9rem;
            }
        }
    </style>
    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo">🎓</div>
        <h1 class="title">Jonas Academy</h1>

        <div class="message-box">
            <p class="status">Temporarily Unavailable</p>
            <p class="message">
                The website is currently down for internal testing and further development.
                <br><br>
                We will be back up and running before the next examination season.
                <br><br>
                Thank you for your patience!
            </p>
        </div>

        <p class="footer-text">Stay tuned for updates</p>
    </div>
</body>
</html>
